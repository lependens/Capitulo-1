name: Forecast Collector Linux tests

on:
  pull_request:
    paths:
      - "forecast_collector/**"
      - "aemet_forecast_collector/**"
      - ".github/workflows/forecast-collector-tests.yml"
  push:
    branches: [main]
    paths:
      - "forecast_collector/**"
      - "aemet_forecast_collector/**"
      - ".github/workflows/forecast-collector-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        working-directory: forecast_collector
        run: python -m pip install -e ".[test]"
      - name: Install AEMET collector test dependencies
        working-directory: aemet_forecast_collector
        run: python -m pip install -e ".[test]"
      - name: Run full test suite
        run: python -m pytest -q -rs forecast_collector/tests aemet_forecast_collector/tests
