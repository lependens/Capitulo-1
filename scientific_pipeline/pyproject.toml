[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siar-science"
version = "0.1.0"
description = "Reproducible daily observational ET0 baselines"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn==1.9.1"]

[project.scripts]
siar-science = "siar_science.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
